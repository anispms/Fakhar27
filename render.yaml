databases:
  - name: fakhar27-db
    plan: free

services:
  - type: web
    name: fakhar27-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fakhar27-db
          property: connectionString
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: ADMIN_PASSWORD
        generateValue: true

  - type: web
    name: fakhar27-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://fakhar27-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
